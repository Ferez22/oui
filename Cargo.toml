[package]
name = "oui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal workspace with per-profile isolated logins and tmux-style sessions"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

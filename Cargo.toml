[package]
name = "oui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal workspace with per-profile isolated logins and tmux-style sessions"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
vt100 = "0.16.2"
